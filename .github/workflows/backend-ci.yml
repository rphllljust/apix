name: backend-ci

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "tests/**"
      - "scripts/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/backend-ci.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install-deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: run-pytest
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup-buildx
        uses: docker/setup-buildx-action@v3

      - name: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
