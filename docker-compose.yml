version: "3.8"

networks:
  app_net:
    driver: bridge

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # /api é relativo: o Nginx do mesmo host faz o proxy para o backend.
        # Se o frontend for acessado de outro domínio, coloque a URL completa:
        # VITE_API_BASE_URL: https://api.seudominio.com
        VITE_API_BASE_URL: /api
        VITE_API_KEY: ${VITE_API_KEY:-}
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_net
